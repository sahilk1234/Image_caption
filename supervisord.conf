[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

# -------------------------------
# Postgres
# -------------------------------
[program:postgres]
command=/app/scripts/start-postgres.sh
user=postgres
priority=1
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

# -------------------------------
# Backend (START FIRST)
# -------------------------------
[program:uvicorn]
command=uvicorn backend.app.main:app --host 127.0.0.1 --port 8000
priority=10
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

# -------------------------------
# nginx (START AFTER uvicorn)
# -------------------------------
[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
